<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#b30839">
  <title>Knight Transportation | Delivering More</title>
  <meta name="description" content="Knight Transportation — Delivering More. Ask our AI about our truckload and logistics services, freight quotes, and driving careers.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Knight Transportation">
  <meta property="og:description" content="Delivering More. A website you can talk to — ask our AI anything about Knight Transportation.">
  <meta property="og:image" content="hero-truck.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="runtime.css">
  <link rel="stylesheet" href="presentation.css">
  <link rel="stylesheet" href="redesign.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to demo</a>
  <header class="site-header">
    <a class="brand-lockup" href="./" aria-label="Knight Transportation home">
      <img class="brand-logo" src="knight-logo.svg" alt="Knight Transportation logo" width="150" height="49">
      <span class="wordmark">Knight <em class="wordmark-outloud">Transportation</em></span>
    </a>
    <span class="header-note"><span class="live-dot" aria-hidden="true"></span> Delivering More</span>
  </header>

  <main id="main">
    <section class="intro" aria-labelledby="headline">
      <h1 id="headline"><img class="headline-mark" src="knight-logo.svg" alt="Knight Transportation logo">Knight <em>Transportation</em></h1>
      <p>Delivering More. Ask a question — our AI answers in its own voice.</p>
    </section>

    <section class="experience" aria-label="Talk to Knight Transportation">
      <div class="avatar-area">
        <div id="ol-avatar-stage" class="ol-avatar-stage" aria-label="Knight Transportation AI avatar"></div>
        <div class="state-line"><span id="ol-state" class="ol-state" data-state="IDLE">Ready when you are</span></div>
      </div>

      <div class="conversation-area">
        <div class="ol-chips" aria-label="Suggested questions">
          <button type="button" class="ol-chip">What services do you offer?</button>
          <button type="button" class="ol-chip">How do I get a freight quote?</button>
          <button type="button" class="ol-chip">How do I become a driver?</button>
          <button type="button" class="ol-chip">How can I contact you?</button>
        </div>
        <div class="ask-row">
          <button type="button" id="ol-mic" class="ol-mic" aria-pressed="false" aria-label="Turn microphone on"><span class="mic-symbol" aria-hidden="true">●</span><span class="ol-btn-label">Talk</span></button>
          <label class="sr-only" for="ol-text-in">Ask Knight Transportation</label>
          <input id="ol-text-in" class="ol-text" type="text" autocomplete="off" placeholder="Or type a question…">
          <button type="button" id="ol-send" class="ol-send" aria-label="Send question">↑</button>
        </div>
        <div class="utility-row">
          <button type="button" id="ol-stop" class="stop-button" hidden>Stop answer</button>
          <button type="button" id="ol-sound" class="ol-sound" aria-pressed="true"><span class="ol-btn-label">Sound: on</span></button>
          <span class="hint">Microphone access is requested only when you tap Talk.</span>
        </div>
        <div class="response-space" id="ol-response-space" aria-live="polite" aria-atomic="true"></div>
        <div class="ol-screen" id="ol-screen" aria-label="Supporting information">
          <div class="ol-screen-body">
            <div id="ol-screen-standby" class="ol-screen-standby" hidden></div>
            <div id="outloud-content-panel" class="ol-host ol-host-screen"></div>
          </div>
        </div>
        <section class="ol-console" aria-label="Conversation transcript"><ol id="ol-log" class="ol-log" aria-live="polite"></ol></section>
      </div>
    </section>
  </main>

  <footer class="site-footer"><span>Knight Transportation · Phoenix, Arizona</span><span>Talk to our AI</span></footer>
  <p class="sr-only" id="ol-sr-status" role="status" aria-live="polite"></p>

  <script src="stock-faces.js"></script>
  <script src="outloud.config.js"></script>
  <script src="event-bus.js"></script>
  <script src="avatar-catalog.js"></script>
  <script src="business-knowledge.js"></script>
  <script src="customer-memory.js"></script>
  <script src="plan-validator.js"></script>
  <script src="response-planner.js"></script>
  <script src="realtime-input.js"></script>
  <script src="speech-director.js"></script>
  <script src="vendor/simli-client.js"></script>
  <script src="simli-director.js"></script>
  <script src="anam-director.js"></script>
  <script src="avatar-director.js"></script>
  <script src="content-director.js"></script>
  <script src="presentation-deck.js"></script>
  <script src="presentation-screen.js"></script>
  <script src="conversation-controller.js"></script>
  <script src="session-orchestrator.js"></script>
  <script src="runtime.js"></script>
  <script src="redesign.js"></script>
</body>
</html>
