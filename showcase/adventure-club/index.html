  <body>
    <div id="root"></div>
    <!-- Adventure Club — animated guide avatar widget (Scout) -->
  <link rel="stylesheet" href="./widget/widget.css?v=2">
  <button id="bc-fab" aria-expanded="false" aria-controls="bc-panel">
    <img src="widget/mascot-closed.svg" alt="Scout" id="bc-avatar" />
    <span class="bc-talk-bubble">Talk to us</span>
  </button>
  <div id="bc-panel" role="dialog" aria-label="Scout — Adventure Club trip guide">
    <div class="bc-head">
      <img src="widget/mascot-closed.svg" alt="" aria-hidden="true" id="bc-head-img" />
      <div class="bc-head-t">
        <b>Adventure Club</b>
        <small>Scout &mdash; trip guide</small>
      </div>
      <button id="bc-mute" title="Voice on" aria-label="Toggle voice">&#128266;</button>
      <button id="bc-close" title="Close" aria-label="Close chat">&#10005;</button>
    </div>
    <div id="bc-video-wrap" aria-hidden="true">
      <span id="bc-video-live"><i></i>LIVE</span>
      <img id="bc-stage" src="widget/mascot-closed.svg" alt="Scout talking" />
    </div>
    <div id="bc-chooser" role="group" aria-label="Choose how to talk to Scout">
      <button id="bc-mode-chat" class="bc-mode-on" title="Type your questions">&#128172; Chat</button>
      <button id="bc-mode-audio" title="Talk out loud, hear spoken replies">&#127908; Audio</button>
      <button id="bc-mode-video" title="See Scout talk on the big stage">&#127909; Video</button>
    </div>
    <div id="bc-log" aria-live="polite"></div>
    <div class="bc-input">
      <input id="bc-in" placeholder="Ask about adventures..." aria-label="Message Adventure Club" />
      <button id="bc-mic" title="Talk hands-free" aria-label="Talk hands-free">&#127908;</button>
      <button id="bc-send">Send</button>
    </div>
  </div>
  <script src="./widget/site-avatar.js?v=2"></script>
</body>
</html>
