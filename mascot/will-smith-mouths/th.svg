<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 474" width="500" height="474">
  <defs>
    <radialGradient id="mouthBg7" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3a1c14"/>
      <stop offset="100%" stop-color="#5a3830"/>
    </radialGradient>
    <linearGradient id="upLip7" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a07060"/>
      <stop offset="100%" stop-color="#6c4440"/>
    </linearGradient>
    <linearGradient id="tongueGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c07060"/>
      <stop offset="100%" stop-color="#b06050"/>
    </linearGradient>
  </defs>
  <!-- "TH" - tongue visible -->
  <ellipse cx="250" cy="330" rx="50" ry="20" fill="url(#mouthBg7)"/>
  <!-- Tongue tip protruding -->
  <ellipse cx="250" cy="328" rx="30" ry="6" fill="url(#tongueGrad)" stroke="#a05040" stroke-width="0.5"/>
  <!-- Upper lip - lifted -->
  <path d="M180 316 Q210 310 240 314 Q250 312 260 314 Q290 310 320 316 Q290 313 260 315 Q250 314 240 315 Q210 313 180 316Z" 
        fill="url(#upLip7)" stroke="#8a6058" stroke-width="0.5"/>
  <!-- Upper teeth barely visible -->
  <rect x="200" y="316" width="100" height="4" rx="1" fill="#ede0d6" opacity="0.5"/>
  <!-- Lower lip -->
  <path d="M180 344 Q220 348 250 346 Q280 348 320 344 Q280 347 250 346 Q220 347 180 344Z" 
        fill="url(#upLip7)" stroke="#8a6058" stroke-width="0.5"/>
</svg>
