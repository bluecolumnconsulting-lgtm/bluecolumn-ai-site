<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 474" width="500" height="474">
  <defs>
    <radialGradient id="mouthBg6" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2a1008"/>
      <stop offset="100%" stop-color="#4a2820"/>
    </radialGradient>
    <linearGradient id="upLip6" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c09080"/>
      <stop offset="100%" stop-color="#7c5450"/>
    </linearGradient>
    <linearGradient id="lowLip6" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7c5450"/>
      <stop offset="100%" stop-color="#c09080"/>
