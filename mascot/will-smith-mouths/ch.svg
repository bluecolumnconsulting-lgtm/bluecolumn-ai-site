  </defs>
  <!-- Wide teeth clenched - "ch", "j", "sh" -->
  <rect x="175" y="312" width="150" height="18" rx="3" fill="url(#mouthBg6)"/>
  <!-- Upper teeth -->
  <rect x="180" y="312" width="140" height="9" rx="1" fill="#ede0d6" stroke="#d0c0b0" stroke-width="0.3"/>
  <!-- Teeth separators -->
  <line x1="215" y1="312" x2="215" y2="321" stroke="#d0c0b0" stroke-width="0.6"/>
  <line x1="230" y1="312" x2="230" y2="321" stroke="#d0c0b0" stroke-width="0.6"/>
  <line x1="245" y1="312" x2="245" y2="321" stroke="#d0c0b0" stroke-width="0.6"/>
  <line x1="260" y1="312" x2="260" y2="321" stroke="#d0c0b0" stroke-width="0.6"/>
  <line x1="275" y1="312" x2="275" y2="321" stroke="#d0c0b0" stroke-width="0.6"/>
  <!-- Upper lip - pulled wide -->
  <path d="M160 313 Q190 308 220 312 Q250 310 280 312 Q310 308 340 313 Q310 310 280 313 Q250 312 220 313 Q190 310 160 313Z" 
