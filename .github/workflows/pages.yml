name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Inject the OpenAI brain key into outloud-v3/outloud.config.js at build
      # time only. The key never touches the repository; the committed file
      # keeps an empty slot. Same pattern as the ElevenLabs key.
      - name: Inject brain key (build-time only)
        env:
          BC_OPENAI_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          python3 - <<'PYEOF'
          import re, os
          path = 'outloud-v3/outloud.config.js'
          key = os.environ['BC_OPENAI_KEY']
          assert key.startswith('sk-'), 'secret missing or malformed'
          s = open(path).read()
          new, n = re.subn(r"openaiKey: '[^']*'", "openaiKey: '" + key + "'", s, count=1)
          assert n == 1, 'openaiKey slot not found in ' + path
          open(path, 'w').write(new)
          print('openaiKey injected (build-time only, not committed)')
          PYEOF

      # Inject the Simli + Anam avatar keys at build time only (never in the
      # repo). Slots in the committed configs stay empty; the live page gets
      # real keys from GitHub Secrets. Covers outloud-v3, outloud-v2, and the
      # app-preview key bundle.
      - name: Inject avatar keys (build-time only)
        env:
          SIMLI_KEY: ${{ secrets.SIMLI_KEY }}
          ANAM_KEY: ${{ secrets.ANAM_KEY }}
        run: |
          set -euo pipefail
          python3 - <<'PYEOF'
          import os
          simli = os.environ.get('SIMLI_KEY', '')
          anam = os.environ.get('ANAM_KEY', '')
          assert simli, 'SIMLI_KEY secret missing'
          assert anam, 'ANAM_KEY secret missing'
          def patch(path, sub):
              s = open(path).read()
              out = s
              for key, val in sub.items():
                  import re
                  out, n = re.subn(r"(%s: )'[^']*'" % re.escape(key), lambda m: m.group(1) + "'" + val + "'", out, count=1)
                  assert n == 1, '%s slot not found in %s' % (key, path)
              open(path, 'w').write(out)
              print('patched %s: %s' % (path, ','.join(sub.keys())))
          patch('outloud-v3/outloud.config.js', {'simliKey': simli, 'anamKey': anam})
          patch('outloud-v2/outloud.config.js', {'simliKey': simli, 'anamKey': anam})
          patch('app-preview/keys.js', {'simliKey': simli})
          PYEOF

      - name: Stage site (strip repo internals)
        run: |
          set -euo pipefail
          mkdir -p /tmp/site
          rsync -a --exclude '.git' --exclude '.github' ./ /tmp/site/
          test -f /tmp/site/CNAME
          test -f /tmp/site/.nojekyll

      # Publish each OutLoud v4 client page at a clean client-branded path,
      # so links read bluecolumn.ai/<client>/outloud (plus an /outloud/<client>
      # alias). Source of truth stays outloud-v4/<client>/ in the repo — these
      # are build-time copies only, so there is no duplicate to maintain.
      - name: Publish OutLoud client paths
        run: |
          set -euo pipefail
          clients="quinta-santo-amaro scuba-junkie"
          for c in $clients; do
            test -d "outloud-v4/$c"
            mkdir -p "/tmp/site/$c/outloud"
            rsync -a "outloud-v4/$c/" "/tmp/site/$c/outloud/"
            mkdir -p "/tmp/site/outloud/$c"
            rsync -a "outloud-v4/$c/" "/tmp/site/outloud/$c/"
          done
          ls -la /tmp/site/quinta-santo-amaro/outloud | head

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
