<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Gradients for the cylinder -->
    <linearGradient id="topGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="40%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="midGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="50%" stop-color="#bae6fd"/>
      <stop offset="100%" stop-color="#7dd3fc"/>
    </linearGradient>
    <linearGradient id="botGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="60%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>
    <linearGradient id="shaftShade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#000" stop-opacity="0.15"/>
      <stop offset="30%" stop-color="#fff" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#fff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.2"/>
    </linearGradient>
    <radialGradient id="topGlow" cx="0.35" cy="0.3" r="0.65">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <!-- Cylinder clip -->
    <clipPath id="cylinderClip">
      <rect x="136" y="56" width="240" height="360" rx="8"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" fill="#ffffff"/>

  <!-- Subtle background glow -->
  <ellipse cx="256" cy="420" rx="160" ry="40" fill="#1d4ed8" opacity="0.08"/>

  <!-- === CYLINDER BODY === -->

  <!-- Main shaft (blue base) -->
  <rect x="146" y="86" width="220" height="340" rx="6" fill="url(#botGrad)"/>

  <!-- Middle segment overlay -->
  <rect x="146" y="166" width="220" height="130" fill="url(#midGrad)" opacity="0.85"/>

  <!-- Top segment overlay -->
  <rect x="146" y="86" width="220" height="80" fill="url(#topGrad)" opacity="0.9"/>

  <!-- Shading overlay on shaft -->
  <rect x="146" y="86" width="220" height="340" rx="6" fill="url(#shaftShade)"/>

  <!-- Left edge highlight -->
  <rect x="146" y="86" width="6" height="340" fill="#fff" opacity="0.12"/>
  <!-- Right edge shadow -->
  <rect x="360" y="86" width="6" height="340" fill="#000" opacity="0.15"/>

  <!-- === CYLINDER CAP (top ellipse) === -->
  <ellipse cx="256" cy="86" rx="110" ry="32" fill="url(#topGrad)"/>
  <ellipse cx="256" cy="86" rx="110" ry="32" fill="url(#shaftShade)"/>
  <ellipse cx="256" cy="86" rx="110" ry="32" fill="url(#topGlow)"/>

  <!-- Top cap highlight rim -->
  <ellipse cx="256" cy="86" rx="100" ry="26" fill="none" stroke="#fff" stroke-width="1.5" opacity="0.3"/>

  <!-- === HORIZONTAL BAND LINES === -->

  <!-- Band 1 (between top and middle) -->
  <ellipse cx="256" cy="166" rx="110" ry="14" fill="none" stroke="#fff" stroke-width="2" opacity="0.25"/>
  <ellipse cx="256" cy="166" rx="110" ry="14" fill="none" stroke="#000" stroke-width="1" opacity="0.08"/>

  <!-- Band 2 (between middle and bottom) -->
  <ellipse cx="256" cy="296" rx="110" ry="14" fill="none" stroke="#fff" stroke-width="2" opacity="0.2"/>
  <ellipse cx="256" cy="296" rx="110" ry="14" fill="none" stroke="#000" stroke-width="1" opacity="0.08"/>

  <!-- === BOTTOM ELLIPSE === -->
  <ellipse cx="256" cy="426" rx="110" ry="24" fill="#1e40af"/>
  <ellipse cx="256" cy="426" rx="110" ry="24" fill="#000" opacity="0.15"/>

  <!-- === BRAND NAME === -->
  <text x="256" y="490" text-anchor="middle" font-family="'Inter', 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="38" font-weight="700" letter-spacing="1" fill="#1e40af">BlueColumn</text>
</svg>
