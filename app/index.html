<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OutLoud App</title>
  <meta name="robots" content="noindex">
  <meta http-equiv="refresh" content="0;url=/app-preview/#/signup">
  <style>
    :root {
      color-scheme: light;
      --ink: #172d32;
      --muted: #61716e;
      --edge: #dfe5df;
      --bg: #f7f7f2;
      --panel: #ffffff;
      --primary: #174b47;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at top left, rgba(194, 222, 214, 0.55), transparent 38%),
        linear-gradient(180deg, #fbfbf7 0%, var(--bg) 100%);
      color: var(--ink);
      font: 16px/1.5 "DM Sans", system-ui, sans-serif;
    }
    .card {
      width: min(560px, 100%);
      padding: 32px;
      border: 1px solid var(--edge);
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.92);
      box-shadow: 0 20px 50px rgba(23, 45, 50, 0.08);
      text-align: center;
    }
    h1 {
      margin: 0 0 10px;
      font: 400 clamp(34px, 6vw, 52px)/1.05 "Newsreader", Georgia, serif;
      letter-spacing: -0.03em;
    }
    p {
      margin: 0;
      color: var(--muted);
    }
    .row {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      margin-top: 24px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 0 18px;
      border-radius: 999px;
      border: 1px solid var(--primary);
      background: var(--primary);
      color: #fff;
      text-decoration: none;
      font-weight: 700;
    }
    .btn.secondary {
      background: transparent;
      color: var(--primary);
    }
  </style>
  <script>
    location.replace('/app-preview/#/signup');
  </script>
</head>
<body>
  <main class="card">
    <h1>OutLoud App</h1>
    <p>Sending you to the self-serve signup flow.</p>
    <div class="row">
      <a class="btn" href="/app-preview/#/signup">Create account</a>
      <a class="btn secondary" href="/app-preview/#/login">Sign in</a>
    </div>
  </main>
</body>
</html>
