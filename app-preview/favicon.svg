<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- deep base -->
  <ellipse cx="16" cy="28" rx="13" ry="4" fill="#1d4ed8"/>
  <!-- shaft -->
  <rect x="3" y="6" width="26" height="22" fill="#2563eb"/>
  <!-- depth shading -->
  <rect x="3"  y="6" width="4" height="22" fill="#1a54d4"/>
  <rect x="25" y="6" width="4" height="22" fill="#1a54d4"/>
  <!-- ring 1 strongest near base -->
  <ellipse cx="16" cy="22" rx="13" ry="4" fill="#1d4ed8" opacity="0.75"/>
  <!-- ring 2 medium -->
  <ellipse cx="16" cy="15" rx="13" ry="4" fill="#1d4ed8" opacity="0.4"/>
  <!-- light cap -->
  <ellipse cx="16" cy="6" rx="13" ry="5" fill="#93c5fd"/>
</svg>
